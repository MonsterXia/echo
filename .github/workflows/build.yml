name: Build
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: replace-dev0-verified-assets
  cancel-in-progress: false
jobs:
  replace-verified-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: MonsterXia/scrcpy-harmony
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify fixed source, CI, merged fix and artifact archive digests
        run: python3 script/replace-dev-prerelease.py prepare
      - name: Validate installer metadata and platform smoke reports
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 script/upload-dev-prerelease.py
      - name: Replace original prerelease and verify downloaded bytes
        run: python3 script/replace-dev-prerelease.py publish
      - name: Preserve replacement audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev0-replacement-audit
          if-no-files-found: warn
          path: |
            release-before.json
            release-after.json
            replacement-audit.json
            source-run.json
            source-artifacts.json
            verified-assets/release-validation.json
            verified-assets/SHA256SUMS.txt
