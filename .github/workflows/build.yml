name: Build
on:
  workflow_dispatch:
# One-off transport of verified artifacts. Publication remains a separate step.
permissions:
  actions: read
  contents: write
jobs:
  upload-verified-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: MonsterXia/scrcpy-harmony
    steps:
      - name: Verify immutable build and draft identity
        shell: bash
        run: |
          gh api repos/MonsterXia/scrcpy-harmony/actions/runs/39978114409 > run.json
          gh release view v1.0.3 --json isDraft,targetCommitish > release.json
          python3 - <<'PY'
          import json
          source = '417e78ff9a4f99bc0d3a68080b9ceb11810d1d09'
          run = json.load(open('run.json'))
          release = json.load(open('release.json'))
          assert run['head_sha'] == source and run['conclusion'] == 'success'
          assert release['isDraft'] and release['targetCommitish'] == source
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 39978114409
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify original bytes and normalize names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          expected = {
            'win-x64.exe': (119188125, 'dfa052e2a5e61724ea3e764686a92afce05902a1a19a3f07fc9c62e3b14f30ee'),
            'mac-arm64.dmg': (125779541, 'e5281ce25cd34dffa81a7e0f7f5eaf3ab63672d332b0f65f98b6a3d936e258f5'),
            'mac-x64.dmg': (130273356, '7f92ddce10e4ca9c5626388257e6a36baf723b6ff247591ae0a3bbcb1b4e184f'),
          }
          Path('assets').mkdir()
          for suffix, (size, sha256) in expected.items():
            matches = list(Path('artifacts').rglob('Scrcpy Harmony-1.0.3-' + suffix))
            assert len(matches) == 1, suffix
            data = matches[0].read_bytes()
            assert len(data) == size and hashlib.sha256(data).hexdigest() == sha256, suffix
            shutil.copyfile(matches[0], Path('assets') / ('Scrcpy-Harmony-1.0.3-' + suffix))
          PY
      - name: Upload installers to existing draft
        run: gh release upload v1.0.3 assets/*
