name: Build
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-verified-dev1
  cancel-in-progress: false
jobs:
  publish-verified-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: MonsterXia/scrcpy-harmony
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source, merged PR, CI and artifact archive digests
        run: python3 script/publish-dev1.py prepare
      - name: Validate installer metadata and installation reports
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 script/upload-dev-prerelease.py
      - name: Upload draft, verify downloaded bytes and publish prerelease
        run: python3 script/publish-dev1.py publish
      - name: Preserve publication audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev1-publication-audit
          if-no-files-found: warn
          path: |
            publication-audit.json
            release-after.json
            source-run.json
            source-artifacts.json
            verified-assets/release-validation.json
            verified-assets/SHA256SUMS.txt
