# One-off branch-only replacement for .github/workflows/build.yml.
# Do not merge this transport workflow or script/dev2-upload into master.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: upload-dev2-assets-427865203
  cancel-in-progress: false

jobs:
  upload-dev2-assets:
    if: github.repository == 'MonsterXia/scrcpy-harmony' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/upload-dev2-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install only the YAML parser outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/dev2-yaml" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund js-yaml@4.3.2
      - name: Verify reviewed inputs and configure local paths
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          inputs = root / 'script/dev2-upload'
          hashes = {
              'publish-dev2.py': '5a5de0b42efac7aad07404f7840500cd761b37e7b5baa775f39bb2d49399850e',
              'config.json': '3f5c556349186255308336c8d1f9a3a31b1f11b154c24cdff0030b69b7482876',
              'release-notes.md': 'd0ebea9d052f7035fc08ddfed190497d95fa7f6ed99ec9b2b653ea1cad9f221c',
              'prepared.json': '9bf0225fb8bd0b6810398b754e1d45924729525a3745bbd2ec5f0a08993458a8',
              'release-state.json': 'fd20c191249225efed535f336c396042bbf0402e63671a3d9dba975ece730b27',
          }
          for name, expected_hash in hashes.items():
              path = inputs / name
              if path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != expected_hash:
                  raise SystemExit('Reviewed input differs: ' + name)
          config = json.loads((inputs / 'config.json').read_text())
          expected = json.loads((inputs / 'prepared.json').read_text())
          state = json.loads((inputs / 'release-state.json').read_text())
          identity = {k: v for k, v in config.items() if k not in ('repo_dir', 'work_dir', 'notes_file')}
          if identity != expected['identity'] or identity != state['identity'] or state['release_id'] != 427865203:
              raise SystemExit('Reviewed identity or fixed release ID differs')
          config.update(repo_dir=str(root), work_dir=str(root / 'release/dev2-publication'),
                        notes_file=str(inputs / 'release-notes.md'))
          output = root / 'release/dev2-runner-config.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(config, indent=2) + '\n')
          PY
      - name: Re-download and verify the same-source Build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/dev2-yaml/node_modules
        run: python3 script/dev2-upload/publish-dev2.py prepare --config release/dev2-runner-config.json
      - name: Require the identical 14-asset manifest and fixed release state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          inputs = Path('script/dev2-upload')
          work = Path('release/dev2-publication')
          expected = json.loads((inputs / 'prepared.json').read_text())
          actual = json.loads((work / 'prepared.json').read_text())
          if actual != expected or len(actual['assets']) != 14:
              raise SystemExit('Runner preparation differs from the reviewed local manifest')
          state = json.loads((inputs / 'release-state.json').read_text())
          if state['release_id'] != 427865203 or state['identity'] != actual['identity']:
              raise SystemExit('Fixed release state differs')
          with (work / 'release-state.json').open('xb') as output:
              output.write((inputs / 'release-state.json').read_bytes())
          PY
      - name: Upload only missing assets to existing draft 427865203
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/dev2-yaml/node_modules
        run: python3 script/dev2-upload/publish-dev2.py upload --config release/dev2-runner-config.json
      - name: Record upload-only completion
        run: |
          echo 'All 14 assets match the reviewed manifest on existing release 427865203. This workflow does not publish; final download verification and publication remain local.' >> "$GITHUB_STEP_SUMMARY"
