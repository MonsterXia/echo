name: Build
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  upload-verified-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: MonsterXia/scrcpy-harmony
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source build and draft identity
        run: |
          gh api repos/MonsterXia/scrcpy-harmony/actions/runs/40117038066 > source-run.json
          gh api repos/MonsterXia/scrcpy-harmony/actions/runs/40117038066/artifacts > source-artifacts.json
          gh release view v1.0.4-dev.0 --json isDraft,isPrerelease,targetCommitish > draft.json
          python3 - <<'PY'
          import json
          source = '0774a0b2d6402c447c362bd18f541e881472e16f'
          run = json.load(open('source-run.json'))
          draft = json.load(open('draft.json'))
          artifacts = json.load(open('source-artifacts.json'))['artifacts']
          assert run['head_sha'] == source and run['conclusion'] == 'success'
          assert draft['isDraft'] and draft['isPrerelease'] and draft['targetCommitish'] == source
          assert len(artifacts) == 3
          assert {a['name'] for a in artifacts} == {'windows-latest', 'macos-15', 'macos-15-intel'}
          assert all(not a['expired'] and a['workflow_run']['head_sha'] == source for a in artifacts)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 40117038066
          github-token: ${{ github.token }}
          path: verified-artifacts
      - name: Validate bytes, metadata and smoke reports
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 script/upload-dev-prerelease.py
      - name: Upload verified assets to draft
        run: gh release upload v1.0.4-dev.0 verified-assets/*
