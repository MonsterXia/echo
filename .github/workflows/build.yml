# One-off branch-only replacement for .github/workflows/build.yml.
# Do not merge this transport workflow or script/dev3-upload into master.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: upload-dev3-assets-428678071
  cancel-in-progress: false

jobs:
  upload-dev3-assets:
    if: github.repository == 'MonsterXia/scrcpy-harmony' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/upload-dev3-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install only the YAML parser outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/dev3-yaml" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund js-yaml@4.3.2
      - name: Verify reviewed inputs and configure local paths
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          inputs = root / 'script/dev3-upload'
          hashes = {
              'publish-dev3.py': 'e7ff0696b02791ccaf97009185af99b33fc4b9cba802181af3ba766362b96e77',
              'config.json': '8f4a227ea227ebc4ff0988fd1cc8bb2364ebf2665c38fdfc93c9f7bfb18efa87',
              'release-notes.md': 'a03997cfb5d2a43fa174eb5af781436c7b0338d91538e3dad247e5a259d6e3a2',
              'prepared.json': '7038511b260a026d82a206ca68fa08ac9f159d7db664f88c366d93d7dceea4be',
              'release-state.json': '6a74651329e860d5e74beb0dd99aae6173640145be224e4f3d722d93361d67f3',
          }
          for name, expected_hash in hashes.items():
              path = inputs / name
              if path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != expected_hash:
                  raise SystemExit('Reviewed input differs: ' + name)
          config = json.loads((inputs / 'config.json').read_text())
          expected = json.loads((inputs / 'prepared.json').read_text())
          state = json.loads((inputs / 'release-state.json').read_text())
          identity = {k: v for k, v in config.items() if k not in ('repo_dir', 'work_dir', 'notes_file')}
          if identity != expected['identity'] or identity != state['identity'] or state['release_id'] != 428678071:
              raise SystemExit('Reviewed identity or fixed release ID differs')
          config.update(repo_dir=str(root), work_dir=str(root / 'release/dev3-publication'),
                        notes_file=str(inputs / 'release-notes.md'))
          output = root / 'release/dev3-runner-config.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(config, indent=2) + '\n')
          PY
      - name: Re-download and verify the same-source Build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/dev3-yaml/node_modules
        run: python3 script/dev3-upload/publish-dev3.py prepare --config release/dev3-runner-config.json
      - name: Require the identical 14-asset manifest and fixed release state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          inputs = Path('script/dev3-upload')
          work = Path('release/dev3-publication')
          expected = json.loads((inputs / 'prepared.json').read_text())
          actual = json.loads((work / 'prepared.json').read_text())
          if actual != expected or len(actual['assets']) != 14:
              raise SystemExit('Runner preparation differs from the reviewed local manifest')
          state = json.loads((inputs / 'release-state.json').read_text())
          if state['release_id'] != 428678071 or state['identity'] != actual['identity']:
              raise SystemExit('Fixed release state differs')
          with (work / 'release-state.json').open('xb') as output:
              output.write((inputs / 'release-state.json').read_bytes())
          PY
      - name: Upload only missing assets to existing draft 428678071
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/dev3-yaml/node_modules
        run: python3 script/dev3-upload/publish-dev3.py upload --config release/dev3-runner-config.json
      - name: Record upload-only completion
        run: |
          echo 'All 14 assets match the reviewed manifest on existing release 428678071. This workflow does not publish; final download verification and publication remain local.' >> "$GITHUB_STEP_SUMMARY"
