name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # These names are used by master's required status checks.
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [test, lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ${{ matrix.check }}
        run: npm run ${{ matrix.check }}

  windows-package:
    # This name is used by master's required status checks.
    name: windows-package
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Download device resources
        # Explicitly choose Git Bash instead of a potentially unavailable WSL Bash.
        run: npx --no-install zx --shell "C:/Program Files/Git/bin/bash.exe" script/resources.mjs
      - name: Build distribution
        run: npm run build
      - name: Package Windows installer
        run: npm run pack -- --no-publish
      - name: Verify package output
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $release = Join-Path release $pkg.version
          $requiredFiles = @(
            "$release/$($pkg.productName)-$($pkg.version)-win-x64.exe",
            "$release/win-unpacked/$($pkg.productName).exe",
            "$release/win-unpacked/resources/app.asar",
            "$release/win-unpacked/resources/hdc/hdc.exe",
            "$release/win-unpacked/resources/uitestkit_sdk/uitest_agent_v1.1.0.so"
          )
          foreach ($file in $requiredFiles) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing package output: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Empty package output: $file"
            }
          }
