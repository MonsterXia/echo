name: Remove Sourcery quota notices
run-name: Sourcery quota cleanup ${{ github.event.comment.id || inputs.comment_id }}

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      comment_id:
        description: Existing PR comment ID to check with the same quota-only rules
        required: true
        type: string

permissions: {}

jobs:
  remove-quota-notice:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.login == 'sourcery-ai[bot]' &&
      github.event.comment.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      # No checkout: never execute code from the PR with a write token.
      - name: Delete only a verified quota-only notice
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { payload } = context;
            let eventComment;
            let issueNumber;
            if (context.eventName === 'workflow_dispatch') {
              if (context.ref !== 'refs/heads/' + payload.repository?.default_branch) return;
              const input = payload.inputs?.comment_id;
              if (typeof input !== 'string' || !/^[1-9]\d*$/.test(input) ||
                  !Number.isSafeInteger(Number(input))) throw new Error('Invalid comment ID');
              try {
                const { data: comment } = await github.rest.issues.getComment({
                  ...context.repo, comment_id: Number(input),
                });
                if (comment.id !== Number(input)) return;
                const prefix = 'https://api.github.com/repos/' + context.repo.owner +
                  '/' + context.repo.repo + '/issues/';
                if (!comment.issue_url?.startsWith(prefix)) return;
                const number = comment.issue_url.slice(prefix.length);
                if (!/^[1-9]\d*$/.test(number) || !Number.isSafeInteger(Number(number))) return;
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo, issue_number: Number(number),
                });
                if (!issue.pull_request) return;
                eventComment = comment;
                issueNumber = Number(number);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info('Comment already absent; nothing to delete.');
                return;
              }
            } else if (context.eventName === 'issue_comment' &&
                ['created', 'edited'].includes(payload.action) && payload.issue?.pull_request) {
              eventComment = payload.comment;
              issueNumber = payload.issue.number;
            } else return;

            // Full-body allowlist of observed limit notices, not keyword matching.
            // Unknown templates and any appended review content are left untouched.
            const quotaNotice = new RegExp(
              String.raw`^Sorry @MonsterXia, you've used your own review budget of \d[\d,]* diff characters for the last 7 days\.\n\n` +
              String.raw`You can request another review in \d+ (?:days?|hours?|minutes?)(?: and \d+ (?:days?|hours?|minutes?))? ` +
              String.raw`by commenting \x60@sourcery-ai review\x60\. \[Upgrade\]\(https://app\.sourcery\.ai/dashboard/billing\?` +
              String.raw`connection=github&owner=MonsterXia&from_surface=github_bot&intent=rate_limit_hit\) to get a review now\.$`
            );
            const sizeLimitNotice = /^Sorry @MonsterXia, your pull request is larger than the review limit of \d[\d,]* diff characters$/;
            const issueUrl = 'https://api.github.com/repos/' + context.repo.owner +
              '/' + context.repo.repo + '/issues/' + issueNumber;
            function isQuotaNotice(comment) {
              return comment?.user?.login === 'sourcery-ai[bot]' &&
                comment.user.type === 'Bot' &&
                comment.issue_url === issueUrl &&
                typeof comment.body === 'string' &&
                [quotaNotice, sizeLimitNotice].some(pattern =>
                  pattern.test(comment.body.replace(/\r\n/g, '\n').trim()));
            }

            if (!isQuotaNotice(eventComment)) {
              core.info('Comment does not match quota-only notice; preserved.');
              return;
            }
            const params = { ...context.repo, comment_id: eventComment.id };
            try {
              const { data: current } = await github.rest.issues.getComment(params);
              // Ignore stale events: an edit may have added real review content.
              if (current.id !== eventComment.id ||
                  current.body !== eventComment.body || !isQuotaNotice(current)) return;
              await github.rest.issues.deleteComment(params);
              core.info('Deleted Sourcery quota notice ' + current.id +
                ' on PR #' + issueNumber);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Comment already absent; nothing to delete.');
            }
