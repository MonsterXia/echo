name: Stable 1.0.4 release operations
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, upload, postrelease]
        required: true
        default: preflight
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    if: inputs.mode != 'upload'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win, arch: x64}
          - {os: macos-15, platform: mac, arch: arm64}
          - {os: macos-15-intel, platform: mac, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm ci --no-audit --no-fund
      - run: python script/stable-release/run-matrix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-${{ inputs.mode }}-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/stable-acceptance/**/evidence/**
            release/stable-acceptance/summary.json
  upload:
    if: inputs.mode == 'upload'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: python script/stable-release/prepare-upload.py
